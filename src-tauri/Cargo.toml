[package]
name = "chups-pos"
description = "CHUPS POS: punto de venta de escritorio"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# El sufijo _lib evita choques de nombre con el binario en Windows.
name = "chups_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pos-core.workspace = true
pos-hardware.workspace = true
pos-licencia.workspace = true
serde.workspace = true
sqlx.workspace = true
tauri = { version = "2", features = [] }
# El "ahora" de los reportes (la misma versión y features que pos-core).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Elegir el logo y la carpeta de los PDF con el diálogo nativo (se usa desde Rust).
tauri-plugin-dialog = "2.8"
# Abrir el PDF de la boleta con el visor del sistema.
tauri-plugin-opener = "2.7"
# Límite de tiempo para la impresora (spawn_blocking + timeout).
tokio = { version = "1", features = ["time"] }
tauri-plugin-updater = "2"
serde_json = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".dependencies]
winreg = "0.56"
# Desactivar las teclas del navegador de WebView2 (las mismas versiones que ya trae Tauri).
webview2-com = "0.39"
windows-core = "0.62"
