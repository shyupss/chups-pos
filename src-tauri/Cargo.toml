[package]
name = "chups-pos"
description = "CHUPS POS: punto de venta de escritorio"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# El sufijo _lib evita choques de nombre con el binario en Windows.
name = "chups_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pos-core.workspace = true
serde.workspace = true
sqlx.workspace = true
tauri = { version = "2", features = [] }
# Elegir el logo y la carpeta de los PDF con el diálogo nativo (se usa desde Rust).
tauri-plugin-dialog = "2.8"
