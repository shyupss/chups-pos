[workspace]
resolver = "2"
members = ["src-tauri", "crates/pos-core", "crates/pos-hardware", "crates/pos-licencia", "tools/chups-licencias"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
pos-core = { path = "crates/pos-core" }
pos-hardware = { path = "crates/pos-hardware" }
pos-licencia = { path = "crates/pos-licencia" }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Build de entrega: binario pequeño y rápido (prioridad del proyecto).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Argon2 sin optimizar tarda segundos por hash: los tests y `tauri dev` lo compilan optimizado.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
