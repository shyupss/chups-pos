[workspace]
resolver = "2"
members = ["src-tauri", "crates/pos-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
pos-core = { path = "crates/pos-core" }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Build de entrega: binario pequeño y rápido (prioridad del proyecto).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
