name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revisiones:
    name: Revisiones (tests, clippy, tipos)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de sistema para compilar Tauri en Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  instalador-windows:
    name: Instalador Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx tauri build
      - name: Tamaño del ejecutable y del instalador
        shell: pwsh
        run: |
          Get-Item target/release/chups-pos.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}
          Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}
      - uses: actions/upload-artifact@v4
        with:
          name: chups-pos-instalador-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
