[package]
name = "pos-core"
description = "Modelo del POS: reglas de negocio y acceso a datos, sin depender de Tauri."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
sqlx.workspace = true
thiserror.workspace = true
# Fecha y hora local de la boleta (la base guarda UTC).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Logo del negocio: solo PNG y JPG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# El logo se guarda como PNG de 1 bit.
png = "0.18"
# PDF de la boleta. Sin features: nada de imágenes del crate image 0.24 ni js-sys.
printpdf = { version = "0.7", default-features = false }
# Medir el ancho del texto con la misma fuente que se incrusta (misma versión que usa printpdf).
owned_ttf_parser = "0.19"
# Barras CODE128 para el PDF (la impresora térmica las arma sola).
barcoders = { version = "2", default-features = false }
# printpdf deja las fuentes sin comprimir: se recomprime el PDF (misma versión y features que printpdf).
lopdf = { version = "0.31", default-features = false, features = ["pom_parser"] }
# PIN de administrador y código de recuperación: solo se guarda su hash Argon2id.
argon2 = "0.6"
# Código de recuperación al azar (la misma versión que usa argon2 para la sal).
getrandom = "0.4"
# Detalle del conteo de efectivo al cerrar la caja.
serde_json = "1"
# Argon2 gasta CPU a propósito: se calcula en spawn_blocking, fuera de los hilos async.
tokio = { version = "1", default-features = false, features = ["rt"] }
# Exportar a Excel (.xlsx). constant_memory: las hojas grandes (ventas con su detalle) se escriben
# fila a fila en un archivo temporal en vez de quedar en memoria.
rust_xlsxwriter = { version = "0.103", features = ["constant_memory", "chrono"] }

[dev-dependencies]
tempfile = "3"
tokio.workspace = true
